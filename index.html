<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <title>Frontend Mentor | Order summary card</title>

</head>

<body>
  <main class="min-vh-100 d-flex align-items-center ">
    <div class="container  d-flex justify-content-center ">
      <div class="card custom-size g-0 mx-3 overflow-hidden rounded-4">

        <img class="card-img-top  img-fluid " src="/images/illustration-hero.svg" class="card-img-top" alt="image">


        <div class="card-body row px-2 mx-3 ">
          <h5 class="card-title  text-center pt-3">Order Summary</h5>
          <p class="card-text text-center  ">You can now listen to millions of songs, audiobooks, and
            podcasts
            on any
            device anywhere you like!
          </p>

          <div class="plan d-flex justify-content-between align-items-center rounded 
          px-auto mb-3 mx-auto ">
            <div class="music-icon-holder me-3 ">
              <img src="images/icon-music.svg" alt="">
            </div>
            <div class="me-auto pt-3">
              <h5 class="annual">Annual Plan</h5>
              <p class="price">$59.99/year</p>
            </div>
            <div>
              <a class=" change" href="#">Change</a>
            </div>
          </div>


          <a href="#" class="btn btn-primary shadow  mx-auto d-flex rounded-3 
          justify-content-center align-items-center
           ">Proceed to Payment</a>

          <div class="text-center">
            <a class="cancle-link" href="#">Cancel Order</a>
          </div>


        </div>


      </div>
    </div>
  </main>

</body>

</html>
